<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;background:radial-gradient(circle at 80% 20%,rgba(230,18,143,.42),transparent 52%),radial-gradient(circle at 12% 88%,rgba(188,18,214,.30),transparent 55%),#120209}
.bars{position:absolute;left:110px;top:300px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.bars i{display:block;height:19px;border-radius:999px;width:165px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6)}
.bars i:nth-child(2){width:124px;background:linear-gradient(90deg,#ff6890,#e879f9)}
.main{position:absolute;left:110px;top:490px;width:860px}
h1{font:500 124px/1.06 'Hanken Grotesk',sans-serif;color:#ffe2e8}
.rule{margin-top:56px;width:120px;height:5px;border-radius:999px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6)}
.line{margin-top:40px;font:400 42px/1.32 'Hanken Grotesk',sans-serif;color:#ffc9d6}
.cta{margin-top:60px;display:inline-flex;align-items:center;gap:22px;padding:30px 52px;border-radius:999px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6);font:500 44px/1 'Hanken Grotesk',sans-serif;color:#fff}
.handle{position:absolute;left:110px;bottom:290px;font:400 30px/1 'Hanken Grotesk',sans-serif;letter-spacing:.18em;color:#ff9fb6}
</style></head><body>
<div class="bars"><i></i><i></i><i></i></div>
<div class="main">
 <h1>Preferimos<br>hacer menos<br>proyectos, y<br>hacerlos bien.</h1>
 <div class="rule"></div>
 <div class="line">Somos ELEM, un estudio de<br>desarrollo web y software a medida.</div>
 <div class="cta">Contanos tu proyecto <svg width="44" height="36" viewBox="0 0 44 36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18H40M26 4L40 18L26 32"/></svg></div>
</div>
<div class="handle">@elem.uy</div>
</body></html>
