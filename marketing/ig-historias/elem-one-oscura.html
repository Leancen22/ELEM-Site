<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;background:radial-gradient(circle at 80% 20%,rgba(230,18,143,.42),transparent 52%),radial-gradient(circle at 12% 88%,rgba(188,18,214,.30),transparent 55%),#120209}
.bars{position:absolute;left:110px;top:340px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.bars i{display:block;height:19px;border-radius:999px;width:165px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6)}
.bars i:nth-child(2){width:124px;background:linear-gradient(90deg,#ff6890,#e879f9)}
.main{position:absolute;left:110px;top:530px;width:860px}
.word{font:500 150px/1 'Hanken Grotesk',sans-serif;letter-spacing:32px;width:max-content;background:linear-gradient(90deg,#ff6890,#e6128f,#bc12d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.name{margin-top:12px;font:500 150px/1.05 'Hanken Grotesk',sans-serif;color:#ffe2e8}
.phrase{margin-top:56px;font:400 46px/1.32 'Hanken Grotesk',sans-serif;color:#ffc9d6;text-wrap:pretty}
.cta{margin-top:68px;display:inline-flex;align-items:center;gap:22px;padding:30px 52px;border-radius:999px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6);font:500 44px/1 'Hanken Grotesk',sans-serif;color:#fff}
.handle{position:absolute;left:110px;bottom:290px;font:400 30px/1 'Hanken Grotesk',sans-serif;letter-spacing:.18em;color:#ff9fb6}
</style></head><body>
<div class="bars"><i></i><i></i><i></i></div>
<div class="main">
 <div class="word">ELEM</div>
 <div class="name">One</div>
 <div class="phrase">La intranet de tu empresa, con<br>anuncios, licencias y recibos<br>de sueldo en el mismo lugar.</div>
 <div class="cta">Solicitá tu demo <svg width="44" height="36" viewBox="0 0 44 36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18H40M26 4L40 18L26 32"/></svg></div>
</div>
<div class="handle">@elem.uy</div>
</body></html>
