<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;background:radial-gradient(circle at 80% 20%,rgba(230,18,143,.42),transparent 52%),radial-gradient(circle at 12% 88%,rgba(188,18,214,.30),transparent 55%),#120209}
.head{position:absolute;left:110px;top:240px;width:860px}
.logo{font:500 112px/1 'Hanken Grotesk',sans-serif;color:#ffe2e8;white-space:nowrap}
.logo b{font-weight:500;letter-spacing:20px;margin-right:12px;background:linear-gradient(90deg,#ff6890,#e6128f,#bc12d6);-webkit-background-clip:text;background-clip:text;color:transparent}
.phrase{margin-top:26px;font:400 40px/1.3 'Hanken Grotesk',sans-serif;color:#ffc9d6}
.browser{position:absolute;left:130px;top:520px;width:900px;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 50px 120px -30px rgba(40,4,24,.55),0 0 0 1px rgba(15,23,42,.08)}
.browser .bar{height:42px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:9px;padding:0 18px}
.browser .dot{width:13px;height:13px;border-radius:50%}
.browser .url{margin-left:16px;height:26px;flex:0 1 360px;border-radius:8px;background:#fff;border:1px solid #e2e8f0;display:flex;align-items:center;padding:0 12px;font-size:15px;color:#64748b}
.browser img{display:block;width:100%}
.phone{position:absolute;left:60px;top:800px;width:400px;height:846px;border-radius:64px;background:#0b0f19;padding:14px;box-shadow:0 60px 120px -30px rgba(40,4,24,.7),inset 0 0 0 2px #2a3242}
.screen{position:relative;width:372px;height:818px;border-radius:50px;overflow:hidden;background:#fff}
.island{position:absolute;top:12px;left:50%;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#0b0f19;z-index:3}
.one-top,.one-bot{position:absolute;left:0;width:372px;background:url(capturas/one-celular.jpg) no-repeat;background-size:372px auto}
.one-top{top:30px;height:726px;background-position:0 0}
.one-bot{bottom:0;height:62px;background-position:0 100%}
.chat-top,.chat-bot{position:absolute;left:0;width:372px;background-image:url(capturas/assist-celular.jpg);background-size:372px auto;background-repeat:no-repeat}
.chat-top{top:54px;height:462px;background-position:0 0}
.chat-bot{bottom:14px;height:154px;background-position:0 100%}
.cta{position:absolute;left:510px;top:1290px;display:inline-flex;align-items:center;gap:18px;padding:28px 42px;border-radius:999px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6);font:500 40px/1 'Hanken Grotesk',sans-serif;color:#fff;white-space:nowrap}
.handle{position:absolute;left:520px;top:1440px;font:400 30px/1 'Hanken Grotesk',sans-serif;letter-spacing:.18em;color:#ff9fb6}
</style></head><body>
<div class="head">
 <div class="logo"><b>ELEM</b>One</div>
 <div class="phrase">Intranet y RRHH en una sola plataforma.</div>
</div>
<div class="browser"><div class="bar"><span class="dot" style="background:#ff5f57"></span><span class="dot" style="background:#febc2e"></span><span class="dot" style="background:#28c840"></span><span class="url">ELEM One · Noticias</span></div><img src="capturas/one-escritorio.jpg"></div>
<div class="phone"><div class="screen"><div class="island"></div><div class="one-top"></div><div class="one-bot"></div></div></div>
<div class="cta">Solicitá tu demo <svg width="40" height="33" viewBox="0 0 44 36" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18H40M26 4L40 18L26 32"/></svg></div>
<div class="handle">@elem.uy</div>
</body></html>
