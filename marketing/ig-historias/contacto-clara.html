<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:'Hanken Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
 background:radial-gradient(circle at 75% 18%,rgba(232,121,249,.38),transparent 55%),radial-gradient(circle at 18% 82%,rgba(255,104,144,.32),transparent 55%),linear-gradient(135deg,#fff1f4,#ffe2e8)}
.brand{position:absolute;left:110px;top:340px}
.bars{display:flex;flex-direction:column;gap:26px;align-items:flex-start}
.bars i{display:block;height:25px;border-radius:999px;width:217px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6)}
.bars i:nth-child(2){width:163px;background:linear-gradient(90deg,#ff6890,#e879f9)}
.main{position:absolute;left:110px;top:600px;width:860px}
h1{font:500 112px/1.02 'Hanken Grotesk',sans-serif;color:#8a0d40}
.sub{margin-top:24px;font:400 38px/1.3 'Hanken Grotesk',sans-serif;color:#a40a43}
.rule{margin-top:44px;width:120px;height:5px;border-radius:999px;background:linear-gradient(90deg,#fb356b,#e6128f,#bc12d6)}
.rows{margin-top:64px;display:flex;flex-direction:column;gap:50px}
.k{font:400 28px/1 'Hanken Grotesk',sans-serif;letter-spacing:.12em;color:#c40847}
.v{margin-top:14px;font:500 52px/1.1 'Hanken Grotesk',sans-serif;color:#8a0d40}
.handle{position:absolute;left:110px;bottom:290px;font:400 30px/1 'Hanken Grotesk',sans-serif;letter-spacing:.18em;color:#c40847}
</style></head><body>
<div class="brand"><div class="bars"><i></i><i></i><i></i></div></div>
<div class="main">
 <h1>Hablemos</h1>
 <div class="sub">Contanos tu proyecto por DM</div>
 <div class="rule"></div>
 <div class="rows">
  <div><div class="k">Email</div><div class="v">contacto@elem.uy</div></div>
  <div><div class="k">Web</div><div class="v">elem.uy</div></div>
  <div><div class="k">LinkedIn</div><div class="v">linkedin.com/company/elemuy</div></div>
 </div>
</div>
<div class="handle">@elem.uy</div>
</body></html>
